[package]
name = "open_isobus"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"
members = ["examples/renderer"]

[dependencies]
nb = "1.1"
log = "0.4"
itoa = "1.0"
paste = "1.0"
bitflags = { version = "2.10" }
heapless = "0.9"
siphasher = "1.0"
# lexical = { version = "7.0", features = ["write-integers", "power-of-two"] }
numtoa = "0.3"
# pcan-basic = { git = "https://github.com/Thom-de-Jong/pcan-basic", optional = true }
peakcan-basic = { git = "https://github.com/tsabelmann/peakcan-basic-rs.git", branch = "development", optional = true }
socketcan = { version = "3.3.0", optional = true }

embedded-graphics = { version = "0.8", optional = true }

[features]
default = ["mock_can_driver", "log_can", "renderer"]
win32 = ["std", "peak_can_driver", "log_can"]
cm4 = ["std", "socket_can_driver"]
renderer = ["dep:embedded-graphics"]

# Driver options
std = ["alloc"]
alloc = []
peak_can_driver = ["dep:peakcan-basic"]
mock_can_driver = []
socket_can_driver = ["dep:socketcan"]

# Logging options
log_can = ["log_can_read", "log_can_write"]
log_all_can = ["log_all_can_read", "log_can_write"]
log_can_write = []
log_can_read = []
log_all_can_read = []


[dev-dependencies]
env_logger = "0.11.3"
embassy-executor = { git = "https://github.com/embassy-rs/embassy.git", features = [
    "log",
    # "integrated-timers",
    "arch-std",
    "nightly",
] }
embassy-time = { git = "https://github.com/embassy-rs/embassy.git", features = [
    "std",
] }
embassy-sync = { git = "https://github.com/embassy-rs/embassy.git", features = [
] }
embassy-futures = { git = "https://github.com/embassy-rs/embassy.git", features = [
] }
